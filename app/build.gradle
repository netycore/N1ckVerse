apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.n1ckverse.unicode'

    compileSdkVersion 36

    defaultConfig {
        applicationId "com.n1ckverse.unicode"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 76
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }

    signingConfigs {
        release {
            storeFile file("../n1ckverse-release.jks")
            storePassword "Shivu@403"
            keyAlias "n1ckverse"
            keyPassword "Shivu@403"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    flavorDimensions "distribution"

    productFlavors {
        play {
            dimension "distribution"
        }

        fdroid {
            dimension "distribution"
            versionNameSuffix "-fdroid"
        }
    }

    lint {
        disable 'ResourceType',
                'GoogleAppIndexingWarning',
                'NullSafeMutableLiveData'
    }
}

dependencies {

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"

    implementation "androidx.emoji2:emoji2-bundled:1.5.0"
    implementation "androidx.preference:preference-ktx:1.2.1"

    implementation "com.google.android.material:material:1.12.0"

    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    debugImplementation composeBom

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.activity:activity-compose:1.9.1"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    implementation "com.github.woxthebox:draglistview:1.7.3"
    implementation "com.github.mreram:showcaseview:1.4.1"

    playImplementation "com.google.android.gms:play-services-ads-lite:23.2.0"
}
