apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.n1ckverse.unicode"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 76
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "distribution"

    productFlavors {
        play {
            dimension "distribution"
        }

        fdroid {
            dimension "distribution"
            versionNameSuffix "-fdroid"
        }
    }

    namespace 'com.n1ckverse.unicode'

    lint {
        disable 'ResourceType', 'GoogleAppIndexingWarning', 'NullSafeMutableLiveData'
    }
}

dependencies {
    // Core AndroidX
    implementation "androidx.core:core-ktx:1.12.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Emoji support
    implementation 'androidx.emoji2:emoji2-bundled:1.4.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // Compose BOM – versions managed centrally
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    debugImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.8.2'

    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // Drag-and-drop list
    implementation 'com.github.woxthebox:draglistview:1.7.3'

    // Showcase (tutorial)
    implementation 'com.github.mreram:showcaseview:1.4.1'

    // Ads (play flavor only)
    playImplementation 'com.google.android.gms:play-services-ads-lite:22.6.0'
}
